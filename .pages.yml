# Pages CMS configuration - https://pagescms.org
# Pilot: edit this Astro site's content in the browser at https://app.pagescms.org
# Copy lives in src/data/*.json, so Page content opens as a form.
# merge: true keeps the homepage entry (the "/" key) and anything not shown in the form.
media:
  input: public/images
  output: /images
settings:
  content:
    merge: true
